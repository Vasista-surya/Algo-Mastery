<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Algo-Mastery — a practical, visual way to explore 56 verified algorithms across Python, Java, and C." />
    <link rel="icon" href="./assets/mark.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.json" />
    <title>Algo-Mastery — Master the Logic</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
        <div class="brand-lockup">
          <a class="brand" href="#/" aria-label="Algo-Mastery home">
            <img src="./assets/logo.svg" alt="" class="brand-logo" />
            <span class="brand-copy"><strong>Algo</strong><span>-Mastery</span></span>
          </a>
          <button class="icon-button sidebar-close" id="sidebar-close" aria-label="Close menu">×</button>
        </div>
        <div class="sidebar-kicker">Learning cockpit</div>
        <nav class="primary-nav">
          <a href="#/" data-nav="home"><span class="nav-icon">⌂</span><span>Overview</span></a>
          <a href="#/explore" data-nav="explore"><span class="nav-icon">⌕</span><span>Explore algorithms</span><span class="nav-count" id="algorithm-count">56</span></a>
          <a href="#/dashboard" data-nav="dashboard"><span class="nav-icon">◫</span><span>My dashboard</span></a>
          <a href="#/download" data-nav="download"><span class="nav-icon">↓</span><span>Android app</span><span class="nav-status">DEV</span></a>
        </nav>
        <div class="sidebar-section-label">Collections</div>
        <div class="collection-list" id="collection-list"></div>
        <div class="sidebar-bottom">
          <div class="mini-card">
            <div class="mini-card-orb">✦</div>
            <div><strong>Learn by tracing</strong><span>Step through the idea, not just the answer.</span></div>
          </div>
          <a class="github-link" href="https://github.com/Vasista-surya/Algo-Mastery" target="_blank" rel="noreferrer"><span>View source on GitHub</span><span>↗</span></a>
        </div>
      </aside>
      <button class="sidebar-scrim" id="sidebar-scrim" aria-label="Close navigation"></button>

      <main class="main-content">
        <header class="topbar">
          <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">☰</button>
          <div class="breadcrumb" id="breadcrumb"><span>Workspace</span><span class="breadcrumb-separator">/</span><strong>Overview</strong></div>
          <div class="topbar-actions">
            <label class="global-search" for="global-search"><span>⌕</span><input id="global-search" type="search" placeholder="Search algorithms" autocomplete="off" /><kbd>/</kbd></label>
            <a class="topbar-icon" href="#/dashboard" aria-label="Open dashboard">♡<span class="saved-dot" id="saved-dot"></span></a>
            <a class="profile-chip" href="#/about" aria-label="About Algo-Mastery"><span class="avatar">AM</span><span class="profile-name">Learner</span><span class="chevron">⌄</span></a>
          </div>
        </header>
        <div class="page-wrap" id="app" aria-live="polite"></div>
      </main>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
